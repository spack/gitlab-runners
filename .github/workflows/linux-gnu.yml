name: linux-gnu image

# Builds linux-gnu/spack.yaml natively on x86_64 and aarch64 runners and pushes
# it as an image with `spack buildcache push`. Packages are pushed to an OCI
# build cache as they are built, so re-running a timed-out job resumes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - linux-gnu/**
    - .github/workflows/linux-gnu.yml
  pull_request:
    paths:
    - linux-gnu/**
    - .github/workflows/linux-gnu.yml

concurrency:
  group: linux-gnu-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Spack and spack-packages; forks, to build with unmerged fixes.
  SPACK_REPOSITORY: haampie-llms/spack
  SPACK_COMMIT: 28e95a43e1407c9448021ab71639829cdfc90252  # spack/spack#53361
  PACKAGES_REPOSITORY: haampie-llms/spack-packages
  PACKAGES_COMMIT: 78fee03288bd14eff22a6d8dd10a2a9c3efdd00d  # version bumps, llvm and py-libclang fixes
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
        - {runner: ubuntu-24.04, arch: amd64, target: x86_64_v3, stack: developer-tools-x86_64_v3-linux-gnu, ml_stack: ml-linux-x86_64}
        - {runner: ubuntu-24.04-arm, arch: arm64, target: aarch64, stack: developer-tools-aarch64-linux-gnu, ml_stack: ml-linux-aarch64}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Check out Spack and spack-packages
      run: |
        for r in "spack $SPACK_REPOSITORY $SPACK_COMMIT" "spack-packages $PACKAGES_REPOSITORY $PACKAGES_COMMIT"; do
          set -- $r
          git init -q $1
          git -C $1 fetch -q --depth 1 https://github.com/$2.git $3
          git -C $1 checkout -q FETCH_HEAD
        done

    - name: Build and push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET: ${{ matrix.target }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        export BASE=$REGISTRY/linux-gnu-base:$TAG-${{ matrix.arch }}
        docker build -t $BASE -f linux-gnu/base.dockerfile linux-gnu
        docker push $BASE
        docker run --rm -e GITHUB_ACTOR -e GITHUB_TOKEN -e REGISTRY -e TARGET -e BASE \
          -e TAG=$TAG-${{ matrix.arch }} -e PYTHONUNBUFFERED=1 \
          -v $PWD/spack:/spack -v $PWD/spack-packages:/spack-packages -v $PWD/linux-gnu:/linux-gnu:ro \
          $BASE /linux-gnu/build.sh

    - name: Test
      run: |
        docker run --rm -e PACKAGES_REPOSITORY -e PACKAGES_COMMIT -e PYTHONUNBUFFERED=1 \
          -e SPACK_CI_TARGET=${{ matrix.target }} -e STACK=${{ matrix.stack }} -e ML_STACK=${{ matrix.ml_stack }} \
          -v $PWD/linux-gnu:/linux-gnu:ro \
          $REGISTRY/linux-gnu-cache:$TAG-${{ matrix.arch }} /linux-gnu/test-ci.sh

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - name: Multi-arch image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        # `spack buildcache push --tag` tags the per-arch images in the cache repository.
        docker buildx imagetools create \
          -t $REGISTRY/linux-gnu:$TAG -t $REGISTRY/linux-gnu:$(date -u +%F)-${{ github.run_id }} \
          $REGISTRY/linux-gnu-cache:$TAG-amd64 $REGISTRY/linux-gnu-cache:$TAG-arm64
