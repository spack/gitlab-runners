name: linux-gnu image

# Builds linux-gnu/spack.yaml natively on x86_64 and aarch64 runners and pushes
# it as an image with `spack buildcache push`. Packages are pushed to an OCI
# build cache as they are built, so re-running a timed-out job resumes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - linux-gnu/**
    - .github/workflows/linux-gnu.yml
  pull_request:
    paths:
    - linux-gnu/**
    - .github/workflows/linux-gnu.yml

permissions: {}

concurrency:
  group: linux-gnu-${{ github.ref }}
  cancel-in-progress: true

env:
  SPACK_REPOSITORY: spack/spack
  SPACK_COMMIT: 7188f9d6e0f345d023d1f947401eeaaf5ced9f5f
  PACKAGES_REPOSITORY: spack/spack-packages
  PACKAGES_COMMIT: ae70016a8d8a009525255a37ec2ad770d443d343
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
        - {arch: amd64, target: x86_64_v3, runner: ubuntu-24.04}
        - {arch: arm64, target: aarch64, runner: ubuntu-24.04-arm}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
    - name: Check out this repository, Spack and spack-packages
      run: |
        for r in ". $GITHUB_REPOSITORY $GITHUB_SHA" "spack $SPACK_REPOSITORY $SPACK_COMMIT" "spack-packages $PACKAGES_REPOSITORY $PACKAGES_COMMIT"; do
          set -- $r  # split into directory, repository and commit
          git init -q "$1"
          git -C "$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
          git -C "$1" checkout -q FETCH_HEAD
        done

    - name: Build and push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        export BASE="$REGISTRY/linux-gnu-base:$TAG-$ARCH"
        docker build -t "$BASE" -f linux-gnu/base.dockerfile linux-gnu
        docker push "$BASE"
        docker run --rm -e GITHUB_ACTOR -e GITHUB_TOKEN -e REGISTRY -e TARGET -e BASE \
          -e TAG="$TAG-$ARCH" -e PYTHONUNBUFFERED=1 \
          -v "$PWD/spack:/spack" -v "$PWD/spack-packages:/spack-packages" -v "$PWD/linux-gnu:/linux-gnu:ro" \
          "$BASE" /linux-gnu/build.sh

    - name: Test
      run: |
        docker run --rm -e PACKAGES_REPOSITORY -e PACKAGES_COMMIT -e TARGET -e PYTHONUNBUFFERED=1 \
          -v "$PWD/linux-gnu:/linux-gnu:ro" \
          "$REGISTRY/linux-gnu-cache:$TAG-$ARCH" /linux-gnu/test-ci.sh

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - name: Multi-arch image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        # `spack buildcache push --tag` tags the per-arch images in the cache repository.
        docker buildx imagetools create \
          -t "$REGISTRY/linux-gnu:$TAG" -t "$REGISTRY/linux-gnu:$(date -u +%F)-$GITHUB_RUN_ID" \
          "$REGISTRY/linux-gnu-cache:$TAG-amd64" "$REGISTRY/linux-gnu-cache:$TAG-arm64"
