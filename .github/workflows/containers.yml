name: Containers
on:
  # This Workflow can be triggered manually
  workflow_dispatch:
  # Build container images on a daily schedule
  schedule:
    - cron: '11 5 * * *'
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  # Let's also build & tag Spack containers on releases.
  release:
    types: [published]

permissions: {}

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  deploy-images:
    timeout-minutes: 1200
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      # Even if one container fails to build we still want the others
      # to continue their builds.
      fail-fast: false
      # 0: image name
      # 1: Dockerfile path
      # 2: Platforms to build
      matrix:
        dockerfile: [[ubuntu-24.04, ubuntu-24.04.dockerfile, 'linux/amd64,linux/arm64'],
                     [tutorial-ubuntu-26.04, tutorial-ubuntu-26.04/Dockerfile, 'linux/amd64']]
    name: Build ${{ matrix.dockerfile[0] }}
    steps:
      - name: Set Container Tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/spack/${{ matrix.dockerfile[0] }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Deploy ${{ matrix.dockerfile[1] }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfiles/${{ matrix.dockerfile[1] }}
          platforms: ${{ matrix.dockerfile[2] }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            ghcr.io/spack/${{ matrix.dockerfile[0] }}:nightly
            ghcr.io/spack/${{ matrix.dockerfile[0] }}:main
            ghcr.io/spack/${{ matrix.dockerfile[0] }}:latest
            ${{ steps.meta.outputs.tags }}
          cache-to: type=inline
