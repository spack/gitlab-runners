name: Containers
on:
  # This Workflow can be triggered manually
  workflow_dispatch:
  # Build container images on a daily schedule
  schedule:
    - cron: '11 5 * * *'
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  # Let's also build & tag Spack containers on releases.
  release:
    types: [published]

permissions: {}

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

# One job per image, so that a failing image does not hold back the others.
jobs:
  ubuntu-24_04:
    name: ubuntu-24.04
    uses: $/.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ubuntu-24.04
      dockerfile: Dockerfiles/ubuntu-24.04.dockerfile
      archs: '["amd64", "arm64"]'

  tutorial-ubuntu-26_04:
    name: tutorial-ubuntu-26.04
    uses: $/.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: tutorial-ubuntu-26.04
      dockerfile: Dockerfiles/tutorial-ubuntu-26.04/Dockerfile
      archs: '["amd64"]'
