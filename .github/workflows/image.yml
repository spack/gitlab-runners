name: Image

# Builds ghcr.io/spack/<image> from a Dockerfile, natively on each architecture,
# and combines the per-architecture images into a multi-arch image. Tags follow
# the event: nightly (schedule), pr-<number>, the branch name, or the release
# tag and latest.

on:
  workflow_call:
    inputs:
      image:
        description: Name of the image, published as ghcr.io/spack/<image>
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile; the build context is the repository
        type: string
        required: true
      archs:
        description: JSON list of architectures to build, amd64 and/or arm64
        type: string
        required: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
  TAG: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out
      run: |
        git init -q .
        git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
        git checkout -q FETCH_HEAD

    - name: Build and push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        ARCH: ${{ matrix.arch }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --push --platform "linux/$ARCH" --file "$DOCKERFILE" \
          --tag "$IMAGE:$TAG-$ARCH" \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --cache-from "$IMAGE:$TAG-$ARCH" --cache-from "$IMAGE:nightly" \
          --cache-from "$IMAGE:main" --cache-from "$IMAGE:latest" \
          --cache-to type=inline \
          .

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - name: Multi-arch image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ARCHS: ${{ join(fromJSON(inputs.archs), ' ') }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        set -- -t "$IMAGE:$TAG"
        if [ "$GITHUB_EVENT_NAME" = release ]; then set -- "$@" -t "$IMAGE:latest"; fi
        for arch in $ARCHS; do set -- "$@" "$IMAGE:$TAG-$arch"; done
        docker buildx imagetools create "$@"
