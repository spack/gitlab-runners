# Tools for Spack's GitLab CI on linux. They are built with AlmaLinux 8's gcc 8.5,
# so they neither wait for the gcc@14 build nor get rebuilt on gcc bumps. Only
# llvm is built with gcc@14, in a second group: clang.cfg refers to the gcc that
# built llvm, and the image has no system gcc.
spack:
  # Last layer of the image; PATH etc. refer to it (buildcache push --env-view).
  view: /opt/view

  specs:
  - group: tools
    specs:
    # The compiler CI builds with.
    - gcc@14 +binutils +profiled build_type=Release languages=c,c++,fortran
    - binutils +ld +gas +plugins ~libiberty
    # Spack's own dependencies and CI tooling.
    - awscli-v2
    - bzip2
    - clingo-bootstrap@spack +optimized
    - curl
    - file
    - git
    - gmake
    - gnupg
    - gzip
    - libtree
    - lz4
    - patch
    - patchelf
    - py-boto3
    - python +optimizations
    - tar
    - unzip
    - vim
    - xz
    - zstd
    override:
      packages:
        c:
          require: [gcc@8.5.0]
        cxx:
          require: [gcc@8.5.0]

  # clang, for stacks that require `%c,cxx=llvm` (py-jaxlib, py-tensorflow).
  - group: llvm
    needs: [tools]
    specs:
    # ~link_llvm_dylib statically links LLVM into every tool: a 3.4 GB layer.
    - llvm@23 +clang +lld +link_llvm_dylib ~lldb ~libomptarget ~offload ~python
    override:
      packages:
        llvm:
          require: ["%c,cxx=gcc@14"]

  concretizer:
    reuse: false

  repos:
    builtin: /spack-packages/repos/spack_repo/builtin

  config:
    install_tree:
      root: /opt/spack

  # build.sh adds `packages:all:require:[target=...]` (x86_64_v3 or aarch64).
  packages:
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
