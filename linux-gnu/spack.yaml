# Tools for Spack's GitLab CI on linux, built inside builder.dockerfile and
# pushed as an image on top of base.dockerfile (see README.md).
#
# Everything except llvm, including gcc@14, is built with AlmaLinux 8's gcc 8.5:
# the tools only run Spack and its helpers, and CI builds with gcc@14 and its
# own gcc-runtime. Not building the tools with gcc@14 keeps them off the
# critical path of the (slow) gcc build and avoids rebuilding all of them on gcc
# bumps.
#
# llvm is built with gcc@14 in a second group: llvm writes `--gcc-install-dir`
# of the compiler that built it into clang.cfg, and the image has no system gcc,
# only Spack's gcc@14. Spack only builds with external or concrete compilers,
# hence the group that `needs` the first one.
spack:
  view: false

  specs:
  - group: tools
    specs:
    # The compiler CI builds with.
    - gcc@14 +binutils +profiled build_type=Release languages=c,c++,fortran
    - binutils +ld +gas +plugins ~libiberty
    # Spack's own dependencies and CI tooling.
    - awscli-v2
    - bzip2
    - clingo-bootstrap@spack +optimized
    - curl
    - file
    - git
    - gmake
    - gnupg
    - gzip
    - libtree
    - lz4
    - patch
    - patchelf
    - py-boto3
    - python +optimizations
    - tar
    - unzip
    - vim
    - xz
    - zstd
    override:
      packages:
        c:
          require: [gcc@8.5.0]
        cxx:
          require: [gcc@8.5.0]

  # clang, for stacks that require `%c,cxx=llvm` (py-jaxlib, py-tensorflow).
  - group: llvm
    needs: [tools]
    specs:
    # +link_llvm_dylib: tools link libLLVM.so/libclang-cpp.so instead of each
    # statically linking LLVM (3.4 GB compressed layer otherwise).
    - llvm@23 +clang +lld +link_llvm_dylib ~lldb ~libomptarget ~offload ~python
    override:
      packages:
        llvm:
          require: ["%c,cxx=gcc@14"]

  concretizer:
    unify: true
    reuse: false

  config:
    install_tree:
      root: /opt/spack

  # build.sh adds `packages:all:require:[target=...]` (x86_64_v3 or aarch64).
  packages:
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
