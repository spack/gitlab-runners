spack:
  view:
    default:
      root: /opt/spack/view
      link: run
  specs:
  - 'awscli'
  - 'clingo-bootstrap@spack +optimized'
  - 'curl'
  - 'file'
  - 'git'
  - 'gmake@4.4:'
  - 'gnupg'
  - 'gzip'
  - 'lz4'
  - 'lzo'
  - 'patch'
  - 'patchelf'
  - 'py-boto3'
  - 'python@3.11 +optimizations'
  - 'tar'
  - 'unzip'
  - 'vim'
  - 'xz'
  - 'zstd'
  config:
    install_tree:
      root: /opt/spack/store
  packages:
    all:
      require: 
      - target=x86_64_v2
      variants: ~nls
    gcc:
      externals:
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
  concretizer:
    unify: true
